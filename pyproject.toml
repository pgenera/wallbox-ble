[project]
name = "wallbox-ble"
version = "0.1.0"
description = "Home Assistant custom component + standalone CLI for Wallbox EVSE chargers over BLE"
requires-python = ">=3.11"
dependencies = [
  "bleak>=0.22",
  "bleak-retry-connector>=3.5",
]

[project.optional-dependencies]
esphome = ["aioesphomeapi>=24"]
dev = ["pytest>=8", "pytest-asyncio>=0.23", "ruff>=0.5"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"
